[package]
name = "redline-agent-app"
version = "0.28.5"
edition = "2021"
license = "MIT"
description = "Tray app for the RedLine agent bridge"
rust-version = "1.82"

# Separate workspace, like `desktop/app`: the Tauri build needs a native webview while the
# headless agent and server keep building in CI/WSL.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
