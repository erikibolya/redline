name: release

# Tag `v*` on the desktop track (e.g. v0.2.0-desktop.1) and this publishes a GitHub pre-release
# with the Windows installer attached, so the download link is a release page instead of a
# CI artifact that expires.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    env:
      # Optional Authenticode signing. Absent = unsigned build (still works, SmartScreen warns).
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app

      # The CLI talks to the running app; shipping it next to the installer means a fresh
      # install is scriptable without a Python toolchain.
      - name: Configure Authenticode signing
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          @{
            bundle = @{
              windows = @{
                certificateFile     = $pfx
                certificatePassword = $env:WINDOWS_CERT_PASSWORD
                digestAlgorithm     = "sha256"
                timestampUrl        = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content desktop/app/tauri.signing.conf.json -Encoding utf8
          "TAURI_EXTRA_ARGS=--config tauri.signing.conf.json" | Out-File -Append $env:GITHUB_ENV

      - name: Build the CLI and the agent
        run: |
          cargo build --release --manifest-path desktop/Cargo.toml -p redline
          cargo build --release --manifest-path desktop/Cargo.toml -p redline-agent

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "redline ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis ${{ env.TAURI_EXTRA_ARGS }}
          includeUpdaterJson: true
          releaseBody: |
            **Windows.** Download `redline_*_x64-setup.exe` below, run it, done — the tray app
            starts on first launch. Connect it to a server (or use it standalone) from the tray:
            *Connect to a server…*.

            This build is **unsigned**, so SmartScreen will warn on first run:
            *More info → Run anyway*.

            After installing, redline lives in the tray. Right-click the tray icon →
            **Copy MCP config** and paste it into your agent's MCP settings.

            `redline.exe` (below) is the command-line client for the same app:
            `redline open shot.png --title "Button / default"`.

            `redline-agent.exe` (below) is the unattended agent bridge — see
            `docs/LOCAL-AGENT.md`. The app starts it from the tray (*Start local agent*).

            Redline the screenshot, the agent writes the fix.

      - name: Attach the CLI and the agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ github.event.inputs.tag || github.ref_name }}"
          desktop/target/release/redline.exe
          desktop/target/release/redline-agent.exe --clobber

  linux:
    name: linux server binary
    # The release is created by the windows job; attaching before it exists fails.
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # Static musl build: runs on Unraid (or any Linux) with no dependencies, no container.
      - name: Build static binary
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl -p redline --manifest-path desktop/Cargo.toml
          cargo build --release --target x86_64-unknown-linux-musl -p redline-agent --manifest-path desktop/Cargo.toml
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp desktop/target/x86_64-unknown-linux-musl/release/redline redline-linux-x86_64
          cp desktop/target/x86_64-unknown-linux-musl/release/redline-agent redline-agent-linux-x86_64
          gh release upload "${{ github.event.inputs.tag || github.ref_name }}" \
            redline-linux-x86_64 redline-agent-linux-x86_64 --clobber

  image:
    name: container image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Same server plus Chromium, for capture_review (screenshot a URL).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Dockerfile.browser
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:browser
            ghcr.io/${{ github.repository }}:browser-${{ github.event.inputs.tag || github.ref_name }}
