name: release

# Tag `v*` on the desktop track (e.g. v0.2.0-desktop.1) and this publishes a GitHub pre-release
# with the Windows installer attached, so the download link is a release page instead of a
# CI artifact that expires.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app

      # The CLI talks to the running app; shipping it next to the installer means a fresh
      # install is scriptable without a Python toolchain.
      - name: Build the CLI
        run: cargo build --release --manifest-path desktop/Cargo.toml -p redline

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "redline ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseBody: |
            **Windows.** Download `redline_*_x64-setup.exe` below, run it, done — the tray app
            starts on first launch. Connect it to a server (or use it standalone) from the tray:
            *Connect to a server…*.

            This build is **unsigned**, so SmartScreen will warn on first run:
            *More info → Run anyway*.

            After installing, redline lives in the tray. Right-click the tray icon →
            **Copy MCP config** and paste it into your agent's MCP settings.

            `redline.exe` (below) is the command-line client for the same app:
            `redline open shot.png --title "Button / default"`.

            Redline the screenshot, the agent writes the fix.

      - name: Attach the CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ github.event.inputs.tag || github.ref_name }}"
          desktop/target/release/redline.exe --clobber

  image:
    name: container image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
