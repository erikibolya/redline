[package]
name = "redline-core"
description = "Session store, HTTP API and MCP server for redline — no GUI dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
base64.workspace = true
argon2.workspace = true
sha2.workspace = true
rand_core.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tower = { version = "0.5", features = ["util"] }
mime_guess.workspace = true
tracing.workspace = true
# The combined inbox asks the other servers in the desktop app's profile list for their
# sessions. Same blocking client (and TLS stack) as the agent bridge, so https:// profiles work
# from the static musl binary too.
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
