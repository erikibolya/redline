<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RedLine — annotate</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <textarea id="text-editor" hidden placeholder="Note"></textarea>
    <div id="hint" class="hint">Draw on the frozen page. The RedLine controls are in the side panel.</div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <button id="close" class="close" type="button" title="Close (Esc)" aria-label="Close">✕</button>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
