name: draft pr

# Every feature branch gets a draft PR to `dev` automatically. Draft means "not ready": the
# auto-merge workflow ignores it, and the branch can keep moving. The agent (or a human) marks it
# ready when the feature is done with `desktop/scripts/feature-ready.sh`.
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    name: open a draft PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the draft PR once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          base=dev
          git fetch origin "$base" --depth=1
          if [ "$(git rev-list --count "origin/$base..HEAD")" -eq 0 ]; then
            echo "No commits ahead of $base; nothing to open."
            exit 0
          fi
          existing="$(gh pr list --head "$branch" --base "$base" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open."
            exit 0
          fi
          gh pr create \
            --draft \
            --base "$base" \
            --head "$branch" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Draft opened automatically. Keep pushing while you work; when the feature is done, run \`desktop/scripts/feature-ready.sh \"summary\"\` to mark it ready for review. Required CI checks and auto-merge take it from there."
