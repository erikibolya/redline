[package]
name = "redline"
description = "Headless redline server (the Tauri app embeds the same core)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "redline"
path = "src/lib.rs"

[[bin]]
name = "redline"
path = "src/main.rs"

[dependencies]
redline-core = { path = "../redline-core" }
axum.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
