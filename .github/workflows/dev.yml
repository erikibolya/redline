name: dev build

# Rolling dev channel: every push to `dev` publishes a prerelease under the moving `dev-build`
# tag. The tag must not share its name with the `dev` branch: git resolves the short name to the
# tag, so `git log dev` and `git merge dev` in a clone would silently use the tag's commit, and
# `git worktree add … dev` fails with "ambiguous object name".
# The desktop app's "Install latest dev build…" reads
#   https://github.com/<owner>/<repo>/releases/download/dev-build/latest.json
# and "Revert to last stable version…" reads the normal `latest` release.

on:
  push:
    branches: [dev]
    paths:
      - "desktop/**"
      - ".github/workflows/dev.yml"
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: true

env:
  # Dev builds must sort *above* the current stable line, otherwise the updater refuses them.
  # Bump this when a new stable minor is released.
  DEV_BASE_VERSION: "0.23.0"

jobs:
  windows:
    name: windows dev build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Dev builds only need to be installable; full LTO adds minutes and is not useful for
      # a throwaway test build. Stable releases keep the production optimisations.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop, desktop/app

      - name: Version the dev build
        shell: pwsh
        run: |
          $version = "${{ env.DEV_BASE_VERSION }}-dev.${{ github.run_number }}"
          @{ version = $version } | ConvertTo-Json -Compress |
            Set-Content desktop/app/tauri.dev.conf.json -Encoding utf8
          "DEV_VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Build the CLI and the agent
        run: |
          cargo build --release --manifest-path desktop/Cargo.toml -p redline
          cargo build --release --manifest-path desktop/Cargo.toml -p redline-agent

      - name: Build and publish the dev release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/app
          tagName: dev-build
          releaseName: "RedLine dev build"
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          args: --bundles nsis --config tauri.dev.conf.json
          releaseBody: |
            Rolling **dev** build from `dev` at `${{ github.sha }}` (version `${{ env.DEV_VERSION }}`).

            Install it from the app: tray → **Install latest dev build…**.
            Go back to the last stable release: tray → **Revert to last stable version…**.

            Dev builds are unreleased snapshots. Windows SmartScreen warns because the build is
            unsigned: *More info → Run anyway*.

      - name: Publish the updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          $version = $env:DEV_VERSION
          $sigPath = "desktop/app/target/release/bundle/nsis/redline_${version}_x64-setup.exe.sig"
          if (!(Test-Path $sigPath)) {
            throw "updater signature not found at $sigPath"
          }
          $signature = (Get-Content $sigPath -Raw).Trim()
          $url = "https://github.com/$env:REPO/releases/download/dev-build/redline_${version}_x64-setup.exe"
          $notes = "Dev build $version from ``dev`` at ${{ github.sha }}."
          $data = @{
            version = $version
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            platforms = @{
              "windows-x86_64" = @{ signature = $signature; url = $url }
              "windows-x86_64-nsis" = @{ signature = $signature; url = $url }
            }
          }
          $data | ConvertTo-Json -Depth 6 | Set-Content latest.json -Encoding utf8
          gh release upload dev-build latest.json --repo $env:REPO --clobber

      - name: Attach the CLI and the agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload dev-build
          desktop/target/release/redline.exe
          desktop/target/release/redline-agent.exe --clobber

  # The dev server on holly runs this tag. It is the browser image (server + Chromium) so the
  # capture endpoint works; the moving tag is what the host-side updater pulls.
  container:
    name: browser dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Dockerfile.browser
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:browser-dev
            ghcr.io/${{ github.repository }}:browser-dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.DEV_BASE_VERSION }}-dev.${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:browser
            type=gha
          cache-to: type=gha,mode=max
