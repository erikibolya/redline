name: desktop

on:
  push:
    branches: [main, desktop]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: core + cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # The GUI crate is a separate workspace on purpose: core + CLI need no webview.
      - name: cargo test
        working-directory: desktop
        run: cargo test --workspace

  e2e:
    name: browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build the server
        run: cargo build --manifest-path desktop/Cargo.toml -p redline
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the test driver
        run: npm install --no-save puppeteer-core@23
      - name: Draw, move, type and submit in a real browser
        env:
          REDLINE_BASE: http://127.0.0.1:8788
          REDLINE_TOKEN: e2e-token
          CHROME_URL: http://127.0.0.1:9222
        run: |
          desktop/target/debug/redline serve --port 8788 --data-dir "$RUNNER_TEMP/data" --token e2e-token > /tmp/redline.log 2>&1 &
          nohup "${{ steps.chrome.outputs.chrome-path }}" --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8788/health && break; sleep 1; done
          sleep 3
          node desktop/scripts/e2e.mjs

  shell:
    name: tauri shell (windows)
    runs-on: windows-latest
    env:
      # createUpdaterArtifacts is on, so every bundle build needs the signing key.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app
      - name: Build the app (compile check for the shell)
        run: cargo build --release --manifest-path desktop/app/Cargo.toml
      - name: Build the NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          args: --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: redline-windows-nsis
          path: desktop/app/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: redline-windows-unsigned
          path: desktop/app/target/release/redline-app.exe
          if-no-files-found: warn
