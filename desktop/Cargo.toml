[workspace]
members = ["crates/redline-core", "crates/redline-server"]
default-members = ["crates/redline-core", "crates/redline-server"]
resolver = "2"

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
mime_guess = "2"
tracing = "0.1"
